<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGOA OPE</title>
<style>
:root{
  /* Charte AGOA (identique au launcher) */
  --rouge:#B3261E; --rouge-fonce:#8E1E18; --rouge-pale:#F6E3E1;
  --encre:#111111; --gris:#7A7A75; --gris-clair:#A8A69D; --trait:#D6D4CC;
  --fond:#F3F2EE; --carte:#FAF9F6; --vert:#1E7A46; --orange:#B45F06; --bleu:#2563B8;
  --vert-bg:#E1F2E7; --orange-bg:#FBEBD9; --bleu-bg:#E3ECF7; --gris-bg:#E8E6DF;
  --ombre:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--encre);background:var(--fond);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}

/* Barre de titre type fenêtre Windows */
.titlebar{height:44px;background:var(--fond);border-bottom:1px solid var(--encre);color:var(--encre);display:flex;align-items:center;padding:0 0 0 12px;gap:10px;flex:none;user-select:none}
.logo{width:26px;height:26px;border-radius:4px;background:var(--carte);color:var(--rouge);font-weight:800;font-size:11px;display:grid;place-items:center;letter-spacing:.3px}
.titlebar .name{font-weight:600}
.titlebar .sub{color:var(--gris);font-size:12px}
.spacer{flex:1}
.mode{display:flex;align-items:center;gap:8px;font-size:12px;background:var(--gris-bg);padding:4px 10px;border-radius:999px;cursor:pointer;border:0;color:var(--encre)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.dot.live{background:var(--vert)}
.wc{display:flex;height:100%}
.wc span{width:46px;display:grid;place-items:center;font-size:13px;opacity:.85}
.wc span:hover{background:rgba(0,0,0,.18)}

/* Disposition */
.app{flex:1;display:grid;grid-template-columns:300px 360px 1fr;min-height:0}
.col{background:var(--carte);border-right:1px solid var(--trait);display:flex;flex-direction:column;min-height:0}
.col.detail{background:var(--fond);border-right:0;overflow:auto}
.colhead{padding:14px 16px 10px;border-bottom:1px solid var(--trait);flex:none}
.colhead h2{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.search{position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--trait);border-radius:8px;background:var(--fond);outline:none}
.search input:focus{border-color:var(--rouge);background:var(--carte);box-shadow:0 0 0 3px var(--rouge-pale)}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;stroke:var(--gris-clair);fill:none;stroke-width:2}
.list{overflow:auto;flex:1}
.item{padding:10px 16px;border-bottom:1px solid var(--trait);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover{background:var(--fond)}
.item.sel{background:var(--rouge-pale);box-shadow:inset 3px 0 0 var(--rouge)}
.item .t{font-weight:600}
.item .s{font-size:12px;color:var(--gris)}
.item .badge{margin-left:auto;flex:none}
.empty{padding:28px 18px;color:var(--gris);text-align:center}

.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fond);color:var(--gris);white-space:nowrap}
.chip.attente{background:var(--orange-bg);color:var(--orange)}
.chip.cours{background:var(--bleu-bg);color:var(--bleu)}
.chip.fini{background:var(--vert-bg);color:var(--vert)}
.count{background:var(--fond);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--gris);font-weight:600}

.btn{border:1px solid var(--encre);background:var(--fond);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--gris-bg)}
.btn.primary{background:var(--encre);border-color:var(--encre);color:#fff}
.btn.primary:hover{background:#333}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--rouge)}
.btn.ghost:hover{background:var(--rouge-pale)}

/* Détail */
.detail .wrap{padding:22px 26px 40px;max-width:980px}
.dh{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.dh h1{margin:0;font-size:22px;letter-spacing:-.01em}
.dh .obj{color:var(--gris);margin-top:2px}
.card{background:var(--carte);border:1px solid var(--trait);border-radius:10px;box-shadow:var(--ombre);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 22px}
.kv label{display:block;font-size:11px;color:var(--gris-clair);text-transform:uppercase;letter-spacing:.05em}
.kv div{font-weight:500;word-break:break-word}
.kv .muted{color:var(--gris-clair);font-weight:400}

.global{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bar{height:8px;background:var(--trait);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--rouge);border-radius:99px;transition:width .3s}
.phase{border-top:1px solid var(--trait);padding:12px 0}
.phase:first-of-type{border-top:0;padding-top:0}
.phase .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.phase .ph b{font-size:14px}
.phase .ph .pct{margin-left:auto;font-weight:700;color:var(--rouge)}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{border:1px solid var(--trait);background:var(--carte);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.step:hover{border-color:var(--gris-clair)}
.step::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--gris-clair)}
.step.encours{border-color:var(--bleu);background:var(--bleu-bg)}
.step.encours::before{border-color:var(--bleu);background:linear-gradient(90deg,var(--bleu) 50%,transparent 50%)}
.step.fait{background:var(--vert-bg);border-color:var(--vert)}
.step.fait::before{border-color:var(--vert);background:var(--vert)}
.hint{font-size:12px;color:var(--gris-clair);margin-top:8px}
.money{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.money div{background:var(--fond);border-radius:8px;padding:8px 12px}
.money label{display:block;font-size:11px;color:var(--gris-clair);text-transform:uppercase;letter-spacing:.05em}
.money b{font-size:16px}

.placeholder{height:100%;display:grid;place-items:center;color:var(--gris);text-align:center;padding:40px}
.placeholder .big{font-size:40px;color:var(--rouge);font-weight:800;letter-spacing:-.02em}

/* Modales */
.veil{position:fixed;inset:0;background:rgba(20,22,26,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
.veil.on{display:flex}
.modal{background:var(--carte);border-radius:8px;width:min(720px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--trait);display:flex;align-items:center}
.modal header h2{margin:0;font-size:17px}
.modal header .x{margin-left:auto;cursor:pointer;color:var(--gris);font-size:20px;border:0;background:0}
.modal .body{padding:18px 20px;overflow:auto}
.modal footer{padding:12px 20px;border-top:1px solid var(--trait);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--trait)}
.tab{padding:10px 14px;cursor:pointer;color:var(--gris);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--rouge);border-color:var(--rouge)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;font-weight:600;color:var(--gris);margin-bottom:3px}
.form input,.form select,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--trait);border-radius:8px;background:var(--carte);outline:none}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--rouge);box-shadow:0 0 0 3px var(--rouge-pale)}
.form textarea{min-height:70px;resize:vertical}
.form .ro{background:var(--fond);font-weight:700}
.sep{grid-column:1/-1;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);font-weight:700;margin-top:6px;border-top:1px solid var(--trait);padding-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--encre);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.status{height:26px;flex:none;background:var(--carte);border-top:1px solid var(--trait);display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--gris);gap:16px}
.mono{font-family:Consolas,monospace;font-size:12px}
@media (max-width:1100px){.app{grid-template-columns:240px 300px 1fr}}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bleu-bg);color:var(--bleu);margin:0 4px 4px 0}
.tag.prio{background:var(--rouge-pale);color:var(--rouge)}
.step{cursor:default}.step:hover{border-color:var(--trait)}
.step small{color:var(--gris);margin-left:4px}
.step.fait small{color:var(--vert)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);padding:4px 8px;border-bottom:1px solid var(--trait)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--trait)}
.notes{white-space:pre-wrap;margin:0 0 10px;font-family:inherit}
.notes b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);margin-bottom:2px}
.banner{margin:16px;padding:12px 14px;background:var(--orange-bg);border:1px solid var(--orange);border-radius:8px;color:var(--encre)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--trait);border-top-color:var(--rouge);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.search input{padding-right:34px}
.search .clr{position:absolute;right:7px;top:7px;width:22px;height:22px;border:0;border-radius:50%;background:var(--gris-bg);color:var(--gris);cursor:pointer;display:none;font-size:14px;line-height:22px;padding:0}
.search .clr:hover{background:var(--trait);color:var(--encre)}
.search.has .clr{display:block}
.immInfo{flex:none;max-height:48%;overflow:auto;border-top:1px solid var(--encre);background:var(--fond);padding:12px 16px 14px}
.immInfo h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);display:flex;justify-content:space-between}
.immInfo .nm{font-weight:700;font-size:15px;margin-bottom:8px}
.ii{margin-bottom:8px}.ii label{display:block;font-size:11px;color:var(--gris-clair);text-transform:uppercase;letter-spacing:.05em}
.ii div{font-weight:500;word-break:break-word}.ii div small{display:block;color:var(--gris);font-weight:400}
.ii.code div{font-family:Consolas,monospace;font-size:16px;font-weight:700;color:var(--rouge)}
</style>
</head>
<body>
<div class="titlebar">
  <div class="logo">OPE</div>
  <div class="name">AGOA OPE</div>
  <div class="sub">Opérations · Agence Rémi Thollet</div>
  <div class="spacer"></div>
  <button class="btn sm" id="refresh" title="Recharger depuis Ragic (F5)">Actualiser</button>
  <button class="mode" id="modeBtn" title="Connexion Ragic" style="margin:0 12px 0 8px"><span class="dot" id="modeDot"></span><span id="modeTxt">Non connecté</span></button>
</div>
<div class="app">
  <section class="col">
    <div class="colhead">
      <h2>Immeubles <button class="btn sm ghost" id="newImm">+ Nouveau</button></h2>
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Code, adresse, syndic, opération…" autocomplete="off" autofocus><button class="clr" id="qClr" title="Effacer (Échap)" tabindex="-1">×</button></div>
    </div>
    <div class="list" id="immList"></div>
    <div class="immInfo" id="immInfo"></div>
  </section>
  <section class="col">
    <div class="colhead">
      <h2><span id="opTitle">Opérations</span> <button class="btn sm ghost" id="newOp">+ Nouvelle</button></h2>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="filters"></div>
    </div>
    <div class="list" id="opList"><div class="empty">Sélectionnez un immeuble.</div></div>
  </section>
  <section class="col detail" id="detail"></section>
</div>
<div class="status"><span id="stInfo"></span><span class="spacer"></span><span id="stVer">v0.3.0</span></div>

<div class="veil" id="veil"><div class="modal">
  <header><h2 id="mTitle">Nouveau</h2><button class="x" id="mClose">×</button></header>
  <div class="tabs" id="mTabs"></div><div class="body" id="mBody"></div>
  <footer><span class="hint" id="mHint" style="margin-right:auto"></span><button class="btn" id="mCancel">Annuler</button><button class="btn primary" id="mSave">Enregistrer dans Ragic</button></footer>
</div></div>

<div class="veil" id="veilCfg"><div class="modal">
  <header><h2>Connexion Ragic</h2><button class="x" id="cClose">×</button></header>
  <div class="body"><div class="form">
    <div><label>Serveur Ragic</label><input id="cSrv" placeholder="eu2.ragic.com"></div>
    <div><label>Compte</label><input id="cAcc" placeholder="agoa"></div>
    <div class="full"><label>Clé API</label><input id="cKey" type="password" placeholder="Clé API Ragic"></div>
    <div class="full hint">La clé est normalement reprise du bouton CONNEXIONS du launcher AGOA. Ce formulaire sert à la saisir à la main (stockée sur ce poste uniquement).</div>
  </div></div>
  <footer><button class="btn" id="cClear">Effacer la clé</button><button class="btn primary" id="cSave">Enregistrer et charger</button></footer>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== Champs Ragic (compte agoa) — identifiants des feuilles OPERATIONS (operations/10) et Immeubles (agoa/3) ===== */
const OPP="operations/10", IMP="agoa/3";
const FO={code:1000295,immeuble:1000278,indice:1000279,objet:1000280,description:1000281,dateProp:1000282,
  ph1:1000283,ph2:1000284,ph3pct:1000285,estimatif:1000286,valide:1000290,dateValid:1000291,
  syndic:1000763,gestionnaire:1000765,statut:1003061,avancement:1001618,priorite:1002536,architecte:1001784,
  totalPhases:1001644,totalFactures:1000414,subFactures:1000394,
  dates:[["Ouverture du dossier",1001716],["Date du rapport",1001627],["Date AO",1001629],["Analyse des offres",1001630],["Assemblée générale",1002779],["Permis",1001635],["Début des travaux",1001624],["Fin des travaux",1001626]],
  notes:[["Études",1001620],["Appel d'offres",1001754],["Analyse",1001756],["Permis",1001755],["AG",1001783],["Travaux",1003074]],
  entreprise:1001619,montant:1001621,
  p1:[["Visite de site",1000641],["Expertise",1000642],["Rapport",1000643]],
  p2:[["APS",1000676],["APD",1000678],["DCE",1000680]],
  p3:[["DPC",1000684],["MDT",1000686],["VISA",1000688],["DET",1000690],["AOR",1000692],["DOE",1000694]],
  p3total:1002700};
const FS={date:1000380,montant:1000489,reglee:1000597,definitive:1000443,av1:1000396,av2:1000397,av3:1000398};
const FI={code:1000020,adresse:1000021,cp:1000833,moa:1000034,syndic:1000035,gestionnaire:1000036,email:1000850,assistante:1000037,lots:2000013,
  codePorte:1000038,loge:1000039,cs:1000040,adrSyndic:1000852,telSyndic:1000853,mobGest:1000906,mailAssist:1000851,mobAssist:1000907};
const LISTO=[FO.code,FO.immeuble,FO.indice,FO.objet,FO.description,FO.dateProp,FO.ph1,FO.ph2,FO.ph3pct,FO.estimatif,FO.valide,FO.syndic,FO.gestionnaire,FO.statut,FO.avancement,FO.priorite,FO.architecte];
const LISTI=Object.values(FI);

/* ===== Utilitaires ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const bb=s=>s?String(s).replace(/\[br\]\[\/br\]/g,"\n").replace(/\[li\]/g,"• ").replace(/\[\/li\]/g,"\n").replace(/\[\/?[a-z]+(=[^\]]*)?\]/gi,"").replace(/\n{3,}/g,"\n\n").trim():"";
const toBB=s=>String(s||"").replace(/\r?\n/g,"[br][/br]");
const pct=v=>{const t=String(v??"");if(!t.trim())return null;const n=num(t);return t.includes("%")||n>1?n:n*100};
const IPC=window.agoa||null;
let cfg={srv:"eu2.ragic.com",acc:"agoa",key:""};
try{cfg={...cfg,...JSON.parse(localStorage.getItem("agoaOpeCfg")||"{}")}}catch(e){}
const live=()=>!!cfg.key;
let DB={imm:[],ops:[]}, sel={imm:null,op:null,filter:"ouvertes"}, cache={}, loadedAt=null;

/* ===== Accès Ragic ===== */
const base=()=>`https://${cfg.srv||"eu2.ragic.com"}/${cfg.acc||"agoa"}`;
async function rg(url,opt={}){
  // Authentification identique au launcher : paramètre APIKey dans l'URL
  url+=(url.includes("?")?"&":"?")+"APIKey="+encodeURIComponent(cfg.key);
  const o={method:opt.method||"GET",headers:{...(opt.headers||{})},body:opt.body};
  let r;
  if(IPC&&IPC.ragic)r=await IPC.ragic({url,method:o.method,headers:o.headers,body:o.body?String(o.body):undefined});
  else{const x=await fetch(url,o);r={ok:x.ok,status:x.status,json:await x.json().catch(()=>({}))}}
  if(!r.ok)throw new Error("Ragic "+r.status+(r.status===401||r.status===403?" (clé refusée)":""));
  if(r.json&&r.json.status==="ERROR")throw new Error(r.json.msg||"Erreur Ragic");
  return r.json;
}
const rows=j=>Object.values(j||{}).filter(v=>v&&typeof v==="object"&&!Array.isArray(v)&&("_ragicId" in v));
async function pageAll(path,ids,onProg){
  const out=[];let off=0;
  for(;;){
    const j=await rg(`${base()}/${path}?api&v=3&naming=EID&limit=1000&offset=${off}`+ids.map(i=>"&fetchDomainIds="+i).join(""));
    const r=rows(j);out.push(...r);if(onProg)onProg(out.length);
    if(r.length<1000)break;off+=1000;
  }
  return out;
}
const mapImm=r=>({id:r._ragicId,code:r[FI.code]||"",adresse:r[FI.adresse]||"",cp:r[FI.cp]||"",moa:r[FI.moa]||"",syndic:r[FI.syndic]||"",gestionnaire:r[FI.gestionnaire]||"",email:r[FI.email]||"",assistante:r[FI.assistante]||"",lots:r[FI.lots]||"",codePorte:r[FI.codePorte]||"",loge:r[FI.loge]||"",cs:r[FI.cs]||"",adrSyndic:r[FI.adrSyndic]||"",telSyndic:r[FI.telSyndic]||"",mobGest:r[FI.mobGest]||"",mailAssist:r[FI.mailAssist]||"",mobAssist:r[FI.mobAssist]||""});
const mapOp=r=>({id:r._ragicId,immeuble:r[FO.immeuble]||"",indice:r[FO.indice]||"",code:r[FO.code]||((r[FO.immeuble]||"")+"-"+(r[FO.indice]||"")),
  objet:r[FO.objet]||"",description:r[FO.description]||"",dateProp:r[FO.dateProp]||"",ph1:num(r[FO.ph1]),ph2:num(r[FO.ph2]),ph3pct:num(r[FO.ph3pct]),
  estimatif:num(r[FO.estimatif]),valide:r[FO.valide]||"",syndic:r[FO.syndic]||"",gestionnaire:r[FO.gestionnaire]||"",
  statut:r[FO.statut]||"attente",avancement:arr(r[FO.avancement]),priorite:arr(r[FO.priorite]),architecte:r[FO.architecte]||""});
async function loadAll(){
  if(!live()){render();return}
  $("#stInfo").innerHTML='<span class="spin"></span>Chargement depuis Ragic…';
  try{
    const ri=await pageAll(IMP,LISTI,n=>$("#stInfo").innerHTML=`<span class="spin"></span>Immeubles : ${n}…`);
    const ro=await pageAll(OPP,LISTO,n=>$("#stInfo").innerHTML=`<span class="spin"></span>Opérations : ${n}…`);
    DB.imm=ri.map(mapImm).filter(i=>i.code).sort((a,b)=>a.code.localeCompare(b.code,"fr"));
    DB.ops=ro.map(mapOp).filter(o=>o.immeuble).sort((a,b)=>b.id-a.id);
    cache={};loadedAt=new Date();
    toast(`Ragic : ${DB.imm.length} immeubles, ${DB.ops.length} opérations`);
  }catch(e){console.error(e);toast("Chargement impossible : "+e.message)}

async function fetchFull(id){
  if(cache[id])return cache[id];
  const j=await rg(`${base()}/${OPP}/${id}?api&v=3&naming=EID&subtables=1`);
  const r=rows(j)[0]||Object.values(j)[0];cache[id]=r;return r;
}
function phaseData(r){
  const sub=Object.values(r["_subtable_"+FO.subFactures]||{}).filter(x=>x&&typeof x==="object");
  const av=k=>{let m=null;sub.forEach(x=>{const p=pct(x[FS[k]]);if(p!==null&&(m===null||p>m))m=p});return m};
  const steps=(l)=>l.map(([n,id])=>({n,v:num(r[id])}));
  const s1=steps(FO.p1),s2=steps(FO.p2),s3=steps(FO.p3);
  const sum=a=>a.reduce((t,x)=>t+x.v,0);
  const est=num(r[FO.estimatif]),p3pct=num(r[FO.ph3pct]);
  const P=[
    {label:"Phase 1 — Visite & rapport",steps:s1,hono:num(r[FO.ph1])||sum(s1),av:av("av1")},
    {label:"Phase 2 — Conception & consultation",steps:s2,hono:num(r[FO.ph2])||sum(s2),av:av("av2")},
    {label:"Phase 3 — Travaux",steps:s3,hono:est*p3pct||num(r[FO.p3total])||sum(s3),av:av("av3")}];
  const tot=P.reduce((t,p)=>t+p.hono,0);
  let global=null;
  if(P.some(p=>p.av!==null)&&tot)global=P.reduce((t,p)=>t+p.hono*Math.min(100,p.av||0),0)/tot;
  else if(num(r[FO.totalPhases]))global=Math.min(100,num(r[FO.totalFactures])/num(r[FO.totalPhases])*100);
  return {P,global,sub,tot};
}

$("#immList").onclick=e=>{const it=e.target.closest("[data-imm]");if(!it)return;sel.imm=it.dataset.imm;sel.op=null;
  const o=opsOf(sel.imm).filter(passF);if(o.length===1)sel.op=o[0].id;render()};
$("#opList").onclick=e=>{const it=e.target.closest("[data-op]");if(!it)return;sel.op=+it.dataset.op;renderOps();renderDetail()};
$("#filters").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;sel.filter=b.dataset.f;renderOps()};
$("#newImm").onclick=()=>live()?openForm("imm"):toast("Connexion Ragic requise");
$("#newOp").onclick=()=>live()?openForm("op",{immeuble:sel.imm||""}):toast("Connexion Ragic requise");
$("#mClose").onclick=$("#mCancel").onclick=closeForm;$("#mSave").onclick=saveForm;
$("#refresh").onclick=loadAll;
$("#modeBtn").onclick=()=>{$("#cSrv").value=cfg.srv;$("#cAcc").value=cfg.acc;$("#cKey").value=cfg.key;$("#veilCfg").classList.add("on")};
$("#cClose").onclick=()=>$("#veilCfg").classList.remove("on");
$("#cSave").onclick=()=>{cfg={srv:$("#cSrv").value.trim()||"eu2.ragic.com",acc:$("#cAcc").value.trim()||"agoa",key:$("#cKey").value.trim()};
  try{localStorage.setItem("agoaOpeCfg",JSON.stringify(cfg))}catch(e){}$("#veilCfg").classList.remove("on");loadAll()};
$("#cClear").onclick=()=>{cfg.key="";try{localStorage.setItem("agoaOpeCfg",JSON.stringify(cfg))}catch(e){}DB={imm:[],ops:[]};$("#veilCfg").classList.remove("on");render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeForm();$("#veilCfg").classList.remove("on")}
  if(e.ctrlKey&&e.key.toLowerCase()==="f"){e.preventDefault();$("#q").focus()}if(e.key==="F5"){e.preventDefault();loadAll()}});
(async()=>{await initConnections();render();loadAll()})();
</script>
</body>
</html>
